<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退款与流量 · ITO 天猫直播</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2317161a'/><rect x='12' y='12' width='8' height='8' fill='%23c9a962'/></svg>">
<link rel="stylesheet" href="shared.css">
<style>
.kvr {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 11.5px; padding: 5px 0; border-bottom: 1px dashed var(--line-2);
}
.kvr:last-child { border-bottom: none; }
.kvr span { color: var(--ink-2); }
.kvr b { font-variant-numeric: tabular-nums; font-weight: 600; }
/* 单品明细：按产品折叠 */
.tr-grp { cursor: pointer; background: rgba(23,22,26,.022); }
.tr-grp:hover { background: rgba(201,169,98,.09); }
.tr-grp td { border-bottom: 1px solid var(--line-2); font-weight: 600; }
.tr-grp .car { display: inline-block; width: 12px; color: var(--gold-d); transition: transform .15s; transform: rotate(0deg); }
.tr-grp.open .car { transform: rotate(90deg); }
.tr-grp .pname { display: inline-flex; align-items: center; gap: 5px; }
.tr-item td { background: transparent; }
.tr-item td:first-child { color: var(--ink-3); }
.tr-item .indent { padding-left: 22px; }
.tr-item[hidden] { display: none; }
.gsum { font-size: 11px; color: var(--ink-3); font-weight: 400; }
.tbtn {
  font: inherit; font-size: 11px; padding: 3px 9px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 2px;
}
.tbtn:hover { border-color: var(--gold); color: var(--gold-d); }
.dash { color: var(--ink-3); }
/* 两表定宽：table-layout:auto 会把「大类」列拉宽、数字列挤到右边，改成按比例固定 */
#catTable { table-layout: fixed; }
#catTable th:nth-child(1) { width: 20%; }
#catTable th:nth-child(2) { width: 10%; }
#catTable th:nth-child(3) { width: 18%; }
#catTable th:nth-child(4) { width: 12%; }
#catTable th:nth-child(5) { width: 20%; }
#catTable th:nth-child(6) { width: 12%; }
#goodsTable { table-layout: fixed; }
#goodsTable th:nth-child(1) { width: 9%; }
#goodsTable th:nth-child(2) { width: 13%; }
#goodsTable th:nth-child(3) { width: 28%; }
#goodsTable th:nth-child(4) { width: 14%; }
#goodsTable th:nth-child(5) { width: 11%; }
#goodsTable th:nth-child(6) { width: 8%; }
#goodsTable th:nth-child(7) { width: 9%; }
#goodsTable th:nth-child(8) { width: 8%; }
#goodsTable td { overflow: hidden; }
/* 8 列比原先 6 列高，滚动区放高一点，一屏能多看 3 行 */
.tbl-wrap.scroll { max-height: 560px; }
</style>
</head>
<body>
<header id="topbar"></header>
<div id="fbar"></div>

<div class="wrap">
  <div class="page-hd">
    <div>
      <h1>退款与流量</h1>
      <p>全店发货与退货结构、品类与商品级退货定位</p>
    </div>
    <div class="hd-right" id="hdRight"></div>
  </div>

  <section class="sec">
    <div class="sec-h">
      <span class="idx">01</span><h2>店铺退款概览</h2><em id="shopRange"></em>
      <div class="right">全店口径（不限直播）</div>
    </div>
    <div class="grid g4" id="shopKpi"></div>
    <div class="alert" id="crossCheck" style="margin-top:12px"></div>
  </section>

  <section class="sec">
    <div class="grid g2">
      <div class="card">
        <div class="card-hd"><h3>退款场景构成</h3><span id="sceneSub"></span></div>
        <div id="sceneBox" class="card-body"></div>
        <div class="legend card-ft" id="sceneLegend"></div>
      </div>
      <div class="card">
        <div class="card-hd"><h3>全店退货率走势</h3><span id="rrSub"></span><div class="r" id="rrRight"></div></div>
        <div id="rrChart" class="chart-wrap"></div>
        <div class="note card-ft" id="rrNote">退货率 = 退货退款金额 ÷ 实际发货额，按订单支付日归集。不含未发货 / 在途 / 已收到货仅退款。</div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h">
      <span class="idx">02</span><h2>品类结构</h2><em id="catSub"></em>
      <div class="right">商品级数据来自单品退款表</div>
    </div>
    <div class="card flush"><div class="tbl-wrap"><table id="catTable"></table></div></div>
    <div class="note" style="padding:10px 20px 0">发货金额 = 支付金额 − 未发货仅退款 − 在途仅退款 − 已收到货仅退款；退货率 = 退货退款金额 ÷ 发货金额。</div>
  </section>

  <section class="sec">
    <div class="sec-h">
      <span class="idx">03</span><h2>单品明细</h2><em id="goodsSub">按产品折叠 · 按发货金额排序</em>
      <div class="right"><button class="tbtn" id="gToggle">展开全部</button></div>
    </div>
    <div class="card flush"><div class="tbl-wrap scroll"><table id="goodsTable"></table></div></div>
    <div class="note" style="padding:10px 20px 0" id="goodsNote"></div>
  </section>

  <section class="sec"><div class="insight" id="insight"></div></section>
</div>

<div class="foot">
  <span id="footMeta"></span>
  <span>发货额 = 支付金额 − 未发货仅退款 − 已收到货仅退款 − 在途仅退款；退货率 = 退货退款总额 ÷ 发货额</span>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  try { await loadData(); } catch (e) {
    document.getElementById('shopKpi').innerHTML = '<div class="empty">' + e.message + '</div>'; return;
  }
  document.getElementById('footMeta').textContent =
    '数据源 ' + D.meta.src + ' · 生成于 ' + D.meta.generated;
  bootShell('30', renderAll);
})();

function renderAll() {
  renderShopKpi();
  renderScene();
  renderRR();
  renderCat();
  renderGoods();
  renderInsight();
}

const shopSum = k => F.shop.reduce((t, x) => t + (x[k] || 0), 0);

/* ---------------- 01 ---------------- */
function renderShopKpi() {
  const pay = shopSum('pay'), ret = shopSum('retRefund'), only = shopSum('onlyRefund');
  const ship = F.shipTotal;
  const rate = ship ? ret / ship : null;
  document.getElementById('shopRange').textContent = F.from + ' ~ ' + F.to;

  const items = [
    { lab: '支付金额', ...mm(pay), sub: F.shop.length + ' 天 · 日均 ' + fmt.money(pay / (F.shop.length || 1)) + '元' },
    { lab: '实际发货额', ...mm(ship), sub: '占支付 ' + fmt.pct(ship / pay) },
    { lab: '退货退款总额', ...mm(ret), sub: '占支付 ' + fmt.pct(ret / pay) },
    { lab: '退货率', val: fmt.pct(rate), unit: '', key: 1, sub: '退货退款 ÷ 发货额' },
  ];
  function mm(v) { const [n, u] = fmt.mpart(v); return { val: n, unit: (u || '') + '元' }; }
  document.getElementById('shopKpi').innerHTML = kpiHtml(items);

  /* 交叉校验：商品级 vs 店铺日级（支付 / 退货退款 两桶都要对上） */
  const gp = F.goods.reduce((t, g) => t + g.pay, 0);
  const gr = F.goods.reduce((t, g) => t + g.ret, 0);
  const dp = pay ? Math.abs(gp - pay) / pay : 0;
  const dr = ret ? Math.abs(gr - ret) / ret : 0;
  document.getElementById('crossCheck').innerHTML = '<span>✓</span><span>'
    + '交叉校验：商品级支付 <b>' + fmt.money(gp) + '元</b> vs 店铺日级 <b>' + fmt.money(pay) + '元</b>，偏差 <b>'
    + (dp * 100).toFixed(2) + '%</b>；商品级退货退款 <b>' + fmt.money(gr) + '元</b> vs 店铺日级 <b>'
    + fmt.money(ret) + '元</b>，偏差 <b>' + (dr * 100).toFixed(2) + '%</b> —— 两个独立数据源互证'
    + (dp < 0.01 && dr < 0.01 ? '通过' : '存在差异，需排查') + '。'
    + '本区间仅退款（未发货 / 在途 / 已收货）合计 <b>' + fmt.money(only) + '元</b>，占支付 <b>'
    + fmt.pct(only / pay) + '</b>，不计入退货率。'
    + (F.shop.length <= 14
      ? '<b style="color:var(--gold-d)">　区间仅 ' + F.shop.length + ' 天，退货大多还没发生，退货率会明显偏低，建议看近 30 天以上区间。</b>'
      : '') + '</span>';
}

/* ---------------- 02 ---------------- */
const SCENES = [
  ['未发货仅退款', '#c9a962'],
  ['在途仅退款', '#3a5778'],
  ['已收到货仅退款', '#6a5b8f'],
  ['退货退款', '#b3352c'],
];

function renderScene() {
  const totals = {};
  SCENES.forEach(([k]) => totals[k] = 0);
  F.shop.forEach(r => SCENES.forEach(([k]) => { totals[k] += (r.scenes && r.scenes[k]) || 0; }));
  const sum = Object.values(totals).reduce((a, b) => a + b, 0);
  document.getElementById('sceneSub').textContent = F.from + ' ~ ' + F.to;

  const items = SCENES.map(([k, c]) => ({
    name: k, v: totals[k], c, txt: fmt.money(totals[k]) + ' <span style="color:#8b867d;font-weight:400">' + fmt.pct(totals[k] / sum) + '</span>',
  })).sort((a, b) => b.v - a.v);

  document.getElementById('sceneBox').innerHTML =
    barsHtml(items)
    + '<div style="display:flex;height:9px;margin-top:16px;border-radius:1px;overflow:hidden">'
    + SCENES.map(([k, c]) => '<div style="width:' + (sum ? (totals[k] / sum * 100).toFixed(2) : 0) + '%;background:' + c + '"></div>').join('')
    + '</div>'
    + '<div class="note">合计 ' + fmt.money(sum) + '元。仅退款类（前三项）合计占 '
    + fmt.pct((totals['未发货仅退款'] + totals['在途仅退款'] + totals['已收到货仅退款']) / sum)
    + '，是发货前后可拦截的部分。</div>';
  document.getElementById('sceneLegend').innerHTML =
    SCENES.map(([k, c]) => '<span><i style="background:' + c + '"></i>' + k + '</span>').join('');
}

function renderRR() {
  const grain = F.days <= 120 ? 'day' : 'week';
  const b = new Map();
  F.shop.forEach(x => {
    if (!x.ship) return;
    const k = grain === 'day' ? x.d : dU.weekStart(x.d);
    const o = b.get(k) || { ship: 0, ret: 0 };
    o.ship += x.ship; o.ret += (x.retRefund || 0);
    b.set(k, o);
  });
  /* 退货率 = 退货退款 ÷ 发货额，按日/周重算分子分母，不做比率平均 */
  const rows = [...b.keys()].sort()
    .map(k => ({ k, v: b.get(k).ship ? b.get(k).ret / b.get(k).ship : null }))
    .filter(r => r.v !== null);
  const avg = rows.length ? rows.reduce((t, r) => t + r.v, 0) / rows.length : null;
  document.getElementById('rrSub').textContent = (grain === 'day' ? '按日' : '按周') + ' · ' + rows.length + ' 点';
  const ret = shopSum('retRefund'), ship = F.shipTotal;
  document.getElementById('rrRight').textContent = '区间 ' + fmt.pct(ship ? ret / ship : null);

  lineChart(document.getElementById('rrChart'), {
    height: 226,
    labels: rows.map(r => fmt.md(r.k)),
    series: [{ name: '退货率', color: '#b3352c', data: rows.map(r => r.v), area: true, width: 1.6 }],
    yFmt: v => (v * 100).toFixed(0) + '%',
    maxXLabels: 10,
    avgLine: avg ? { value: avg, label: '均值 ' + fmt.pct(avg), color: '#b3352c' } : null,
  });

  /* 退货退款发生在支付之后，末端几天还没退回来，曲线尾部必然偏低——
     不说明会被读成「退货率突然改善」，这里用尾部 5 天与区间值对比自动提示 */
  const last = F.shop.slice(-5);
  const ls = last.reduce((t, x) => t + (x.ship || 0), 0);
  const lr = last.reduce((t, x) => t + (x.retRefund || 0), 0);
  const tail = ls ? lr / ls : null;
  const base = ship ? ret / ship : null;
  const note = document.getElementById('rrNote');
  note.innerHTML = '退货率 = 退货退款金额 ÷ 实际发货额，按订单支付日归集。不含未发货 / 在途 / 已收到货仅退款。'
    + (tail !== null && base && tail < base * 0.7
      ? '<b style="color:var(--gold-d)">　区间末 5 天退货率仅 ' + fmt.pct(tail) + '（全区间 ' + fmt.pct(base)
        + '），系退货尚未发生所致，不宜按「改善」解读。</b>'
      : '');
}

/* ---------------- 03 品类 ---------------- */
/* 退货率配色：整体约 12%，故按 8% / 14% 两档分色（原 25%/40% 是按退款率定的，已不适用） */
function retColor(v) {
  if (v === null || v === undefined) return 'var(--ink-3)';
  return v > 0.14 ? 'var(--red)' : v > 0.08 ? 'var(--gold-d)' : 'var(--green)';
}

function renderCat() {
  document.getElementById('catSub').textContent = F.from + ' ~ ' + F.to;
  const m = new Map();
  F.goods.forEach(g => {
    const k = g.cat || '未匹配';
    const o = m.get(k) || { cat: k, ship: 0, ret: 0, n: 0 };
    o.ship += g.ship; o.ret += g.ret; o.n++;
    m.set(k, o);
  });
  const rows = [...m.values()].sort((a, b) => b.ship - a.ship);
  const ts = rows.reduce((t, x) => t + x.ship, 0);

  let html = '<thead><tr><th>大类</th><th>商品数</th><th>发货金额</th><th>占比</th><th>退货退款金额</th><th>退货率</th></tr></thead><tbody>';
  rows.forEach(r => {
    const rate = r.ship ? r.ret / r.ship : null;
    html += '<tr><td>' + r.cat + '</td><td class="num">' + r.n + '</td>'
      + '<td class="num">' + fmt.money(r.ship) + '</td>'
      + '<td class="num">' + fmt.pct(r.ship / ts) + '</td>'
      + '<td class="num">' + fmt.money(r.ret) + '</td>'
      + '<td class="num" style="color:' + retColor(rate) + ';font-weight:600">' + fmt.pct(rate) + '</td></tr>';
  });
  const t = rows.reduce((o, r) => ({ n: o.n + r.n, ship: o.ship + r.ship, ret: o.ret + r.ret }), { n: 0, ship: 0, ret: 0 });
  html += '</tbody><tfoot><tr><td>合计</td><td class="num">' + t.n + '</td><td class="num">' + fmt.money(t.ship)
    + '</td><td class="num">100%</td><td class="num">' + fmt.money(t.ret) + '</td>'
    + '<td class="num">' + fmt.pct(t.ship ? t.ret / t.ship : null) + '</td></tr></tfoot>';
  document.getElementById('catTable').innerHTML = html;
}

/* ---------------- 05 单品（按产品折叠） ---------------- */
let gOpenAll = false;

function renderGoods() {
  /* 不筛 ship>0：支付被仅退款吃光的商品也要留有行位，否则本表商品数与 04 品类表对不上 */
  const rows = F.goods;
  const byProd = new Map();
  for (const g of rows) {
    const k = g.prod || '未匹配';
    if (!byProd.has(k)) byProd.set(k, []);
    byProd.get(k).push(g);
  }
  /* 产品行取「发货额占比最大的大类」作代表，避免把 P2 TRUNK 这类跨大类的产品标错 */
  const groups = [...byProd.entries()].map(([prod, arr]) => {
    const ship = arr.reduce((t, x) => t + x.ship, 0);
    const ret = arr.reduce((t, x) => t + x.ret, 0);
    /* 直播间金额按「有归因明细的商品」汇总，渗透率的分母也只用这些商品的发货额，
       否则产品里混进无明细商品会把渗透率压低，看起来像直播卖不动 */
    const hasL = arr.filter(x => x.live !== null);
    const live = hasL.length ? hasL.reduce((t, x) => t + x.live, 0) : null;
    const liveShip = hasL.reduce((t, x) => t + x.liveShip, 0);
    const pen = live !== null && liveShip > 0 ? live / liveShip : null;
    const catSum = {};
    arr.forEach(x => { catSum[x.cat] = (catSum[x.cat] || 0) + x.ship; });
    const cat = Object.keys(catSum).sort((a, b) => catSum[b] - catSum[a])[0] || '—';
    /* 直播间退货率按金额重新汇总，不能拿商品零售退率做简单平均。
       分子分母都是已校准的金额（分子＝订单退货退款×k，分母＝直播金额×店铺发货率） */
    const lRetAmt = hasL.reduce((t, x) => t + (x.liveRetAmt || 0), 0);
    const lShip = hasL.reduce((t, x) => t + (x.liveShipL || 0), 0);
    arr.sort((a, b) => b.ship - a.ship);
    return {
      prod, cat, n: arr.length, ship, ret, rate: ship ? ret / ship : null,
      live, liveShip, pen, items: arr,
      lRetAmt, lShip,
      liveRate: hasL.length && lShip > 0 ? lRetAmt / lShip : null,
    };
  }).sort((a, b) => b.ship - a.ship);

  const k = F.goods.liveK;
  const lf = F.goods.liveFrom, lt = F.goods.liveTo;
  document.getElementById('goodsSub').textContent =
    '按产品折叠 · 按发货金额排序 · ' + rows.length + ' 个商品 / ' + groups.length + ' 个产品'
    + (k ? ' · 直播间三列基于 ' + rows.length + ' 个商品中 ' + rows.filter(x => x.live !== null).length + ' 个有明细，校准系数 ' + k.toFixed(3) : ' · 本区间无直播明细');

  let html = '<thead><tr><th>大类</th><th>产品</th><th>商品</th><th class="num">店铺发货金额</th>'
    + '<th class="num">直播间金额</th><th class="num">渗透率</th>'
    + '<th class="num">店铺退货率</th><th class="num">直播间退货率</th></tr></thead><tbody>';

  if (!groups.length) {
    html += '<tr><td colspan="8" style="text-align:center;color:#8b867d;padding:30px">所选区间内暂无单品数据</td></tr>';
  }

  groups.forEach((gr, gi) => {
    html += '<tr class="tr-grp' + (gOpenAll ? ' open' : '') + '" data-g="' + gi + '">'
      + '<td>' + gr.cat + '</td>'
      + '<td><span class="pname"><span class="car">▸</span>' + gr.prod + '</span></td>'
      + '<td class="gsum">' + gr.n + ' 个商品</td>'
      + '<td class="num">' + fmt.money(gr.ship) + '</td>'
      + numCell(gr.live)
      + pctCell(gr.pen, gr.live === null ? '' : '直播间金额 ' + fmt.money(gr.live) + ' ÷ 有明细商品发货 '
        + fmt.money(gr.liveShip) + ' = ' + fmt.pct(gr.pen) + '；该产品全部发货 ' + fmt.money(gr.ship)
        + '，其中 ' + fmt.pct(gr.liveShip / (gr.ship || 1)) + ' 有直播明细')
      + '<td class="num" style="color:' + retColor(gr.rate) + ';font-weight:600">' + fmt.pct(gr.rate) + '</td>'
      + liveRetCell(gr.liveRate, gr.liveRate === null ? '' : '直播间退货退款 ' + fmt.money(gr.lRetAmt)
        + ' ÷ 直播间发货 ' + fmt.money(gr.lShip) + '（直播金额 × 店铺发货率）= ' + fmt.pct(gr.liveRate))
      + '</tr>';

    gr.items.forEach(g => {
      html += '<tr class="tr-item" data-g="' + gi + '"' + (gOpenAll ? '' : ' hidden') + '>'
        + '<td></td><td></td>'
        + '<td class="name-cell indent" title="' + g.name + '">' + g.name + '</td>'
        + '<td class="num">' + fmt.money(g.ship) + '</td>'
        + numCell(g.live)
        + pctCell(g.pen, g.live === null ? '' : '直播间金额 ' + fmt.money(g.live) + ' ÷ 店铺发货 '
          + fmt.money(g.liveShip) + ' = ' + fmt.pct(g.pen))
        + '<td class="num" style="color:' + retColor(g.rate) + ';font-weight:600">' + fmt.pct(g.rate) + '</td>'
        + liveRetCell(g.liveRetRate, g.liveRetRate === null ? '' : '直播间退货退款 ' + fmt.money(g.liveRetAmt)
          + '（订单退货退款 ' + fmt.money(g.liveRfRet) + ' × 校准系数 ' + (F.goods.liveK || 0).toFixed(3)
          + '）÷ 直播间发货 ' + fmt.money(g.liveShipL) + '（直播金额 ' + fmt.money(g.live)
          + ' × 店铺发货率）= ' + fmt.pct(g.liveRetRate))
        + '</tr>';
    });
  });
  document.getElementById('goodsTable').innerHTML = html + '</tbody>';
  document.getElementById('goodsNote').innerHTML = goodsNoteHtml(k, lf, lt, rows);
  /* 产品行点击展开 / 收起自己那一组 */
  document.querySelectorAll('.tr-grp').forEach(tr => {
    tr.onclick = () => {
      const on = !tr.classList.contains('open');
      tr.classList.toggle('open', on);
      document.querySelectorAll('.tr-item[data-g="' + tr.dataset.g + '"]')
        .forEach(x => { x.hidden = !on; });
    };
  });

  const btn = document.getElementById('gToggle');
  btn.textContent = gOpenAll ? '收起全部' : '展开全部';
  btn.onclick = () => {
    gOpenAll = !gOpenAll;
    document.querySelectorAll('.tr-grp').forEach(tr => tr.classList.toggle('open', gOpenAll));
    document.querySelectorAll('.tr-item').forEach(x => { x.hidden = !gOpenAll; });
    btn.textContent = gOpenAll ? '收起全部' : '展开全部';
  };
}

/* 直播间三列的空值渲染：null 一律显示「—」，不能当 0 */
function numCell(v) {
  return v === null || v === undefined
    ? '<td class="num dash">—</td>'
    : '<td class="num">' + fmt.money(v) + '</td>';
}
function pctCell(v, title) {
  if (v === null || v === undefined) return '<td class="num dash">—</td>';
  const col = v >= 0.5 ? 'var(--gold-d)' : 'var(--ink)';
  return '<td class="num"' + (title ? ' title="' + title + '"' : '')
    + ' style="color:' + col + ';font-weight:600">' + fmt.pct(v) + '</td>';
}

/* 直播间退货率单独走配色：退货率越低越好，不能沿用渗透率那套「越高越金」 */
function liveRetCell(v, title) {
  if (v === null || v === undefined) return '<td class="num dash">—</td>';
  return '<td class="num"' + (title ? ' title="' + title + '"' : '')
    + ' style="color:' + retColor(v) + ';font-weight:600">' + fmt.pct(v) + '</td>';
}

/* 单品明细表下说明：把校准法讲透，避免被当成「直接拿订单金额 / 店铺发货」 */
function goodsNoteHtml(k, lf, lt, rows) {
  const lg = D.liveMeta || {};
  if (!k) {
    return '<b>本区间没有可用的直播归因明细</b>：订单明细只覆盖 '
      + (lg.from || '—') + ' ~ ' + (lg.to || '—') + '（' + (lg.days || 0) + ' 天），'
      + '选到更早的区间时这三列无法计算，故显示「—」。';
  }
  const ordPay = rows.reduce((t, g) => t + (g.liveOrd || 0), 0);
  const gmv = F.sessions.reduce((t, s) => t + (s.d >= lf && s.d <= lt ? (s.gmv || 0) : 0), 0);
  const nL = rows.filter(g => g.live !== null).length;
  let s = '';
  /* 区间越界必须在最前面说：否则「店铺发货金额 2.4 亿」配「渗透率 3%」会被当成真实渗透率 */
  if (lf && lt && (lf !== F.from || lt !== F.to)) {
    s += '<b>注意：本区间超出订单明细的覆盖范围</b>，直播间三列只能按 ' + lf + ' ~ ' + lt
      + ' 这段计算，渗透率的分母也是这段的店铺发货额，与左边「店铺发货金额」那一列的区间不同，两者不可直接相除。<br>';
  }
  s += '<b>直播间金额 = 该商品订单支付额 × 校准系数 ' + k.toFixed(3) + '</b>。'
    + '系数取「区间内场次口径成交 ' + fmt.money(gmv) + '元 ÷ 订单口径支付 ' + fmt.money(ordPay) + '元」。'
    + '两个口径本就不同（场次表按下单归集，订单表按支付时用户所在场），'
    + '逐日系数稳定在 0.34~0.60、中位 0.47，62 天中没有一天接近 1，属系统性差异而非噪声；'
    + '所以用总量锚定场次口径、商品结构沿用订单表占比。';
  s += '<br><b>渗透率</b> = 直播间金额 ÷ 店铺发货额，分母只含有归因明细的 ' + nL + ' 个商品'
    + '（占本表 ' + rows.length + ' 个商品的 ' + fmt.pct(nL / (rows.length || 1)) + '），'
    + '其余商品没有直播明细，显示「—」而不是 0。';
  const lmeta = D.liveMeta || {};
  s += '<br><b>直播间退货率</b> = 直播间退货退款 ÷ 直播间发货额。<br>'
    + '<b>分子</b>：订单明细的真实退货退款额 × 校准系数 ' + k.toFixed(3) + '（与「直播间金额」同尺度）。'
    + '订单明细只记退款金额、不记退款场景，场景结构取自「退款数据源-单品」<b>同商品同支付日</b>的'
    + ' 退货退款 ÷（退货退款 + 仅退款）占比再乘回去（该表时间类型为「订单支付时间」，与订单明细按支付日归因同源）'
    + (lmeta.retCover ? '；全部 ' + fmt.pct(lmeta.retCover) + ' 的退款额都取到了同日同商品的场景记录' : '') + '。<br>'
    + '<b>分母</b>：不能直接用「订单支付 − 订单退款」。订单明细的退款记录并不完整——'
    + '它能对上店铺同商品退货退款的 18.1%、仅退款的却只有 10.9%，两类不成比例，'
    + '说明仅退款漏记较多；直接用会让分母虚高、退货率被压低近一半（实测 8.7%，店铺同商品 14.7%）。'
    + '故分母改按「直播金额 × 店铺同商品发货率」折算。<br>'
    + '<b>局限</b>：一是场景结构与发货率都是借店铺同商品的值、不是逐单标签，量级可信、小数位不可当精确值；'
    + '二是退款按支付日归因，越靠近截止日未退完的越多，选最近几天时这一列会系统性偏低。';
  /* 右删失提示：只差几天时单日退货率可能接近 0，不提示会被当成「又没数据」 */
  const gap = lmeta.to && lt ? Math.round((new Date(lmeta.to) - new Date(lt)) / 86400000) : 9;
  if (gap >= 0 && gap < 7) {
    s += '<br><b>注意：区间末日 ' + lt + ' 距明细截止 ' + lmeta.to + ' 只有 ' + gap + ' 天</b>，'
      + '这段时间支付的订单大多还没走完退货流程，直播间退货率会明显偏低（单日可能接近 0），'
      + '看水平请用整月或更长区间。';
  }
  /* 口径差必须写在明面上：两列的分子分母来源都不同，比大小会得出错误结论 */
  const shopPay = rows.reduce((t, g) => t + (g.pay || 0), 0);
  if (shopPay > 0 && ordPay > 0) {
    s += '<br><b>本列与左侧「店铺退货率」是两套不同池子的数据，不可直接比大小</b>：'
      + '左边是该商品店铺全渠道；本列只覆盖订单明细里的场次关联订单，其支付额 ' + fmt.money(ordPay)
      + ' 为本表商品店铺支付 ' + fmt.money(shopPay) + ' 的 ' + fmt.pct(ordPay / shopPay)
      + '。两列同时看趋势可以，落到具体百分点要记住上游样本不同。';
  }
  return s;
}

/* ---------------- 06 ---------------- */
function renderInsight() {
  const pay = shopSum('pay'), ret = shopSum('retRefund'), only = shopSum('onlyRefund');
  const ship = F.shipTotal;
  const li = [];
  li.push('本区间全店退货率 <b>' + fmt.pct(ship ? ret / ship : null) + '</b>（退货退款 ' + fmt.money(ret)
    + '元 ÷ 发货 ' + fmt.money(ship) + '元）。另有仅退款（未发货 / 在途 / 已收到货）<b>' + fmt.money(only)
    + '元</b>，占支付 <b>' + fmt.pct(only / pay) + '</b>，这部分发生在发货前后、不进退货率，'
    + '却是发货额只有支付 <b>' + fmt.pct(ship / pay) + '</b> 的主因。');

  const bad = F.goods.filter(g => g.ship > 500000 && (g.rate || 0) > 0.18);
  const seenProd = new Set();
  const badTop = bad.filter(g => { if (seenProd.has(g.prod)) return false; seenProd.add(g.prod); return true; }).slice(0, 3);
  if (badTop.length) {
    li.push('高退货产品（发货额 >50 万且退货率 >18%）：'
      + badTop.map(g => '<b>' + g.prod + '</b>（' + g.cat + '，' + fmt.pct(g.rate) + '）').join('、')
      + '。建议核对详情页尺码表、实物色差与包装防护。');
  }

  const topCat = [...new Set(F.goods.map(g => g.cat))].map(c => {
    const arr = F.goods.filter(g => g.cat === c);
    return { c, ship: arr.reduce((t, g) => t + g.ship, 0), ret: arr.reduce((t, g) => t + g.ret, 0) };
  }).sort((a, b) => b.ship - a.ship)[0];
  if (topCat) {
    li.push('最大品类是 <b>' + topCat.c + '</b>（发货 ' + fmt.money(topCat.ship) + '元），其退货率 <b>'
      + fmt.pct(topCat.ship ? topCat.ret / topCat.ship : null) + '</b>，是退货大盘的主要影响因素。');
  }

  /* 渗透率只在本区间能算的时候才说，越界区间下这个结论会被分母稀释，宁可不写 */
  if (F.goods.liveK) {
    const bp = new Map();
    for (const g of F.goods) {
      if (g.live === null) continue;
      const p = bp.get(g.prod) || { prod: g.prod, live: 0, ship: 0 };
      p.live += g.live; p.ship += g.liveShip;
      bp.set(g.prod, p);
    }
    const pr = [...bp.values()].filter(x => x.ship > 500000)
      .map(x => ({ prod: x.prod, pen: x.live / x.ship })).sort((a, b) => b.pen - a.pen);
    if (pr.length >= 2) {
      li.push('直播渗透率（直播间金额 ÷ 该产品有明细商品的发货额）：最高 <b>' + pr[0].prod + '</b> '
        + fmt.pct(pr[0].pen) + '，最低 <b>' + pr[pr.length - 1].prod + '</b> ' + fmt.pct(pr[pr.length - 1].pen)
        + '。渗透率越高的产品，销量越依赖直播承接，坑位与话术的波动会直接落到它的日销上。');
    }
  }

  document.getElementById('insight').innerHTML =
    '<h3>退款与流量结论</h3><ol>' + li.map(x => '<li>' + x + '</li>').join('') + '</ol>'
    + '<div class="src">退货率 = 退货退款金额 ÷ 实际发货额；实际发货额 = 支付金额 − 未发货仅退款 − 在途仅退款 − 已收到货仅退款。'
    + '直播间金额为订单明细校准值（订单支付 × 场次口径校准系数），商品级与店铺日级两套独立数据已交叉校验。</div>';
}

onResize(() => { renderRR(); });
